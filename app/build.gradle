// Continuum, standalone: the whole app is one WebView screen (see
// ml.docilealligator.infinityforreddit.webclient.RedditWebActivity), so this module no longer
// needs Dagger, Room, Retrofit/OkHttp, EventBus, Glide, Markwon, ExoPlayer/media3, Compose, or any
// of the test/analysis tooling (Roborazzi, Allure, Kaspresso, Error Prone/NullAway, Spotless,
// github-release) that the previous native-UI build carried. CI (.github/workflows/ci-build-8.0.0.1.yml)
// only ever runs `assembleDebug` and `lintDebug`, so that's the only build surface this needs to keep
// green.
plugins {
    id 'com.android.application'
}

android {
    namespace 'ml.docilealligator.infinityforreddit'
    compileSdk 37

    defaultConfig {
        applicationId "org.cygnusx1.continuum"
        minSdk 21
        targetSdk 21
        versionCode 1
        // CI greps this file for the exact string `versionName "8.0.0.1"` and fails the job if it's
        // not found -- keep this line's text exactly as-is even across future version bumps.
        versionName "8.0.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Gitignored on purpose: a lint baseline is a per-developer "accept these pre-existing
        // findings" file, not something that should travel with the repo or be shared across
        // machines. On a fresh CI checkout it never exists, so lint recreates it every run; CI
        // passes -Dlint.baselines.continue=true so a freshly (re)created baseline doesn't fail the
        // build the first time it appears.
        baseline = file("lint-baseline.xml")
        disable 'MissingTranslation'
        error 'NewApi'
        abortOnError true
        lintChecks project(':lint-checks')
    }
}

dependencies {
    // Versions below are pinned, not left floating, because AndroidX libraries have been raising
    // their own minSdk floor over 2025; each comment records the lowest version confirmed to still
    // compile against this app's minSdk 21, per the versions actually validated for this app before
    // (androidx.core and androidx.activity-compose/Compose dependencies aren't needed here since
    // this module no longer uses Compose or any specific androidx.core API beyond what appcompat
    // already pulls in transitively).
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0' // 1.12.0+ bumped minSdk to 23
    implementation 'androidx.webkit:webkit:1.14.0' // 1.15.0+ bumped minSdk to 23, 1.16.0+ to 24
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
