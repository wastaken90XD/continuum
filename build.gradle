buildscript {
    ext {
        kotlin_version = '2.3.21'
    }

    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.0'
        classpath 'com.android.tools.build:gradle-kotlin:9.3.0'
        // :app is plain Java now (it's just the WebView screen), but :lint-checks still applies
        // the Kotlin JVM plugin, which resolves its version from this classpath entry.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
